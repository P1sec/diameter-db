
[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[project]
name = "diameter-db"
version = "0.1.0"
description = "The largest compiled database of Diameter AVPs and command codes you can find"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.13.5",
    "lxml>=6.1.0",
    "quart>=0.20.0",
    "requests>=2.33.1",
    "sqlalchemy>=2.0.49",
]

[project.scripts]
diameter-db-create-schema = "diameter_db.common.database:main"
diameter-db-regenerate = "diameter_db.fetch.regenerate:main"
diameter-db-webapp = "diameter_db.webapp.app:main"

[project.urls]
Homepage = "https://github.com/P1sec/diameter-db"
Repository = "https://github.com/P1sec/diameter-db"
Issues = "https://github.com/P1sec/diameter-db/issues"

[tool.ruff]
line-length = 79
exclude = [
    ".git",
    "compare_data_sources/diafuzzer",
    "compare_data_sources/wireshark"
]

[tool.ruff.format]
quote-style = "single"

